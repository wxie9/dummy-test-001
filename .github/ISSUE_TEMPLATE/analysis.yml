name: 计算分析
description: 明确分析输入、方法、环境与复现交付
title: "[分析] "
body:
  - type: input
    id: owner
    attributes:
      label: 负责人
      description: 填已登记的成员代号；需要在 GitHub 侧另行指派 Assignee。
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: 分析问题与关联
      description: 问题/假设 ID、文献、上游实验/运行和相关记录路径。
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: 输入数据与访问条件
      description: D-ID、精确版本、样本清单、校验和及共享定位；尚未确定时明确依赖，不填写访问令牌。
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: 方法与运行环境
      description: 拟采用的分析、代码/流程、参数、比较基线、评价标准和环境要求。
    validations:
      required: true
  - type: textarea
    id: deliverables
    attributes:
      label: 交付物与完成标准
      description: 代码、R-ID 运行记录、实际执行命令、环境文件、结果定位、验证方法和目标时间。
    validations:
      required: true
