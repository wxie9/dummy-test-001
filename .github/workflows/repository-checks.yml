name: Repository checks

'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation-links:
    name: Documentation links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check local Markdown targets and anchors
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          lycheeVersion: v0.24.2
          args: >-
            --offline --include-fragments=anchor-only --hidden
            --no-progress --root-dir '${{ github.workspace }}' './**/*.md'
          fail: true
          failIfEmpty: true
          output: ${{ runner.temp }}/lychee-report.md

  large-files:
    name: Large files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full Git history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test the file-size policy
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Inspect current files and newly introduced history
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          args=()
          if [[ -n "$BASE_REF" && ! "$BASE_REF" =~ ^0+$ ]]; then
            args+=(--base-ref "$BASE_REF")
          fi
          python3 scripts/check_large_files.py "${args[@]}"
